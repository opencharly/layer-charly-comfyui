charly-comfyui:
    candy:
        description: |-
            Metadata concept candy owning the charly-comfyui skills whose names have no namesake candy (comfyui image-generation image). Owns its family's `skill:` kind entities (sibling nodes in this file) — the
            the plugins→candies migration; candy/plugin-marketplace regenerates the marketplace
            corpus (the standalone opencharly/marketplace repo) from them.
        plan:
            - run: this documentation-only candy ships no install content (it carries the family's skill/hook/marketplace entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: the comfyui concept candy's skill entities are present and generated into the marketplace's comfyui/skills
              id: charly-comfyui-present
              context:
                - build
              command: "true"

comfyui-layer-skill:
    skill:
        name: comfyui-layer
        family: comfyui
        owner: charly-comfyui
        description: |-
            ComfyUI image generation service on port 8188 with CUDA GPU support.
            Use when working with ComfyUI, image generation, Stable Diffusion, or AI art pipelines.
